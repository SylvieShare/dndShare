server {
    listen 80;
    listen [::]:80;
    server_name dndshare.ru www.dndshare.ru;
    location /.well-known/acme-challenge/ { root /var/www/dndshare-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dndshare.ru www.dndshare.ru;
    ssl_certificate /etc/letsencrypt/live/dndshare.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dndshare.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;
    location ^~ /internal/ { return 404; }
    location / {
        proxy_pass http://dndshare_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
