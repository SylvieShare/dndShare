<!doctype html>
<html>
  <body>
    <script type="module">
      import {
        WebGLRenderer,
        Scene,
        OrthographicCamera,
        HemisphereLight,
        DirectionalLight,
      } from "three";
      import { acquireModelLoader } from "/src/features/maps/rendering/modelLoader.js";
      const gpu = new WebGLRenderer({ antialias: true });
      gpu.setSize(640, 480);
      document.body.append(gpu.domElement);
      const loader = acquireModelLoader(gpu);
      window.decodeTile = async (url) => {
        const gltf = await loader.load(url),
          scene = new Scene(),
          camera = new OrthographicCamera(-2.8, 2.8, 2.1, -2.1, 0.1, 100);
        scene.add(gltf.scene, new HemisphereLight(0xffffff, 0x625141, 2));
        const sun = new DirectionalLight(0xfff2df, 3);
        sun.position.set(-20, 40, -25);
        scene.add(sun);
        camera.position.set(4, 5, 6);
        camera.lookAt(0, 0, 0);
        gpu.render(scene, camera);
        let triangles = 0;
        const textures = new Set();
        gltf.scene.traverse((node) => {
          if (!node.isMesh) return;
          triangles += node.geometry.index.count / 3;
          for (const value of Object.values(node.material))
            if (value?.isTexture) textures.add(value);
        });
        return {
          triangles,
          textures: [...textures].map((t) => ({
            compressed: t.isCompressedTexture,
            width: t.image.width,
            mips: t.mipmaps.length,
            colorSpace: t.colorSpace,
          })),
          rendered: gpu.info.render.triangles,
        };
      };
    </script>
  </body>
</html>
