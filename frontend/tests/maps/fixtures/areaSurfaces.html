<!doctype html>
<html>
  <body style="margin: 0">
    <script type="module">
      import {
        BoxGeometry,
        BufferGeometry,
        DoubleSide,
        Float32BufferAttribute,
        Group,
        Matrix4,
        Mesh,
        MeshBasicMaterial,
        OrthographicCamera,
        Scene,
        Vector3,
        WebGLRenderer,
      } from "three";
      import { createTileLayer } from "../../../src/features/maps/rendering/tileLayer.js";
      import { buildModelObject } from "../../../src/features/maps/rendering/modelObject.js";
      import { applyAreaOpacity } from "../../../src/features/maps/rendering/areaOpacity.js";
      import { createMapFog } from "../../../src/features/maps/rendering/mapFog.js";
      import { createVolumeFog } from "../../../src/features/maps/rendering/volumeFogRenderer.js";
      const gpu = new WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: true,
      });
      gpu.setSize(480, 360);
      document.body.append(gpu.domElement);
      const scene = new Scene(),
        camera = new OrthographicCamera(-2, 2, 1.5, -1.5, 0.1, 30);
      const metadata = {
        id: "floor",
        width: 1,
        height: 1,
        mountDepth: 0,
        maxHeight: 0.4,
      };
      const shell = new BoxGeometry(1, 0.3, 1);
      const inside = new BufferGeometry();
      inside.setAttribute(
        "position",
        new Float32BufferAttribute(
          [-0.4, 0.25, -0.4, 0, 0.25, 0.4, 0.4, 0.25, -0.4],
          3,
        ),
      );
      const surface = new MeshBasicMaterial({
          color: 0xc6a170,
          side: DoubleSide,
        }),
        black = new MeshBasicMaterial({ color: 0x050505, side: DoubleSide });
      const parts = [
        {
          geometry: shell,
          material: surface,
          matrix: new Matrix4().makeTranslation(0, 0.25, 0),
        },
        { geometry: inside, material: black, matrix: new Matrix4() },
      ];
      let includeInside = true;
      const assets = {
        metadata: () => metadata,
        model: () => ({ parts: includeInside ? parts : parts.slice(0, 1) }),
      };
      const fog = createMapFog();
      const doc = {
        width: 4,
        height: 4,
        zones: [],
        lightingEnabled: false,
        tiles: [0, 1].map((x) => ({
          id: `tile-${x}`,
          modelId: "floor",
          x,
          y: 0,
          rotation: 0,
        })),
        areas: [],
      };
      fog.update(doc, null, true);
      const volume = createVolumeFog(gpu, fog.uniforms),
        tiles = createTileLayer(assets, fog);
      const props = new Group();
      const occluder = new Mesh(
        new BoxGeometry(0.25, 0.2, 0.25),
        new MeshBasicMaterial({ color: 0x33aaff }),
      );
      occluder.position.set(0.5, 0.6, 0.5);
      scene.add(tiles.root, props, occluder);
      function frame({
        opacity = 0.5,
        interior = true,
        angle = 45,
        cloud = false,
      } = {}) {
        includeInside = interior;
        tiles.rebuild(doc.tiles, "render", [], () => opacity);
        props.clear();
        const prop = buildModelObject(
          { id: "prop", modelId: "floor", x: 1, y: 1.5, scale: 1, rotation: 0 },
          assets,
          fog,
        );
        applyAreaOpacity(prop, opacity);
        props.add(prop);
        camera.position.set(
          1 + Math.sin((angle * Math.PI) / 180) * 5,
          6,
          0.7 + Math.cos((angle * Math.PI) / 180) * 5,
        );
        camera.lookAt(1, 0.2, 0.7);
        camera.updateMatrixWorld(true);
        // A separate cloud also exercises the offscreen scene colour/depth path.
        doc.areas = cloud
          ? [{ id: "mist", fog: true, tileIds: ["tile-1"] }]
          : [];
        volume.update(doc, doc.tiles, [metadata]);
        volume.render(scene, camera);
      }
      const pixels = () => {
        const gl = gpu.getContext(),
          bytes = new Uint8Array(480 * 360 * 4);
        gl.readPixels(0, 0, 480, 360, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
        return bytes;
      };
      window.areaSurfaces = {
        frame,
        compare(options) {
          frame({ ...options, interior: false });
          const expected = pixels();
          frame({ ...options, interior: true });
          const actual = pixels();
          let changed = 0,
            maximum = 0;
          for (let i = 0; i < actual.length; i += 4) {
            const delta = Math.max(
              ...[0, 1, 2].map((n) =>
                Math.abs(actual[i + n] - expected[i + n]),
              ),
            );
            if (delta > 2) changed++;
            maximum = Math.max(maximum, delta);
          }
          return { changed, maximum };
        },
        sample(position) {
          const p = new Vector3(...position).project(camera),
            gl = gpu.getContext(),
            bytes = new Uint8Array(4);
          gl.readPixels(
            Math.floor((p.x + 1) * 240),
            Math.floor((p.y + 1) * 180),
            1,
            1,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            bytes,
          );
          return [...bytes];
        },
        ready: true,
      };
      frame();
    </script>
  </body>
</html>
