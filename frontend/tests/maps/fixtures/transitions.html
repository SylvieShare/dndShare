<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import {
        ACESFilmicToneMapping,
        BoxGeometry,
        Color,
        Group,
        Matrix4,
        Mesh,
        MeshStandardMaterial,
        OrthographicCamera,
        Scene,
        WebGLRenderer,
      } from "three";
      import { createAreaTransitions } from "../../../src/features/maps/rendering/areaTransitions.js";
      import { areaAppearance } from "../../../src/features/maps/lib/mapAreas.js";
      import { applySceneAreaAppearance } from "../../../src/features/maps/rendering/areaOpacity.js";
      import { createTileLayer } from "../../../src/features/maps/rendering/tileLayer.js";
      import { createMapLighting } from "../../../src/features/maps/rendering/mapLighting.js";
      import { createMapFog } from "../../../src/features/maps/rendering/mapFog.js";
      import { createVolumeFog } from "../../../src/features/maps/rendering/volumeFogRenderer.js";
      const gpu = new WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: true,
      });
      gpu.setSize(640, 480);
      gpu.toneMapping = ACESFilmicToneMapping;
      document.body.append(gpu.domElement);
      const scene = new Scene();
      scene.background = new Color(0x161b23);
      const camera = new OrthographicCamera(-2, 2, 1.5, -1.5, 0.1, 50);
      camera.position.set(5, 5, 5);
      camera.lookAt(0.5, 0.3, 0.5);
      camera.updateMatrixWorld(true);
      const metadata = {
          id: "floor",
          width: 1,
          height: 1,
          maxHeight: 0.25,
          mountDepth: 0,
        },
        geometry = new BoxGeometry(1, 0.25, 1),
        material = new MeshStandardMaterial({ color: 0x888877 }),
        part = {
          geometry,
          material,
          matrix: new Matrix4().makeTranslation(0, 0.125, 0),
        };
      const assets = {
        catalogue: () => [metadata],
        metadata: () => metadata,
        model: () => ({ parts: [part] }),
      };
      const doc = {
        width: 4,
        height: 4,
        zones: [],
        tiles: [
          {
            id: "tile",
            modelId: "floor",
            x: 0,
            y: 0,
            elevation: 0,
            level: 0,
            rotation: 0,
          },
        ],
        objects: [{ id: "prop", placement: { tileId: "tile", point: 0 } }],
        areas: [
          {
            id: "area",
            fog: false,
            hidden: false,
            tileIds: ["tile"],
            objectIds: ["prop"],
          },
        ],
        lightingEnabled: true,
        sun: { enabled: false, angle: 225, elevation: 45 },
        lights: [
          {
            id: "lamp",
            enabled: true,
            showMarker: false,
            shadows: false,
            flicker: false,
            color: "#ffc36a",
            x: 0.5,
            y: 0.5,
            elevation: 0,
            height: 1,
            intensity: 8,
            radius: 4,
            offset: [0, 0],
            areaId: "area",
          },
        ],
      };
      const fog = createMapFog();
      fog.update(doc, null, true);
      const motion = createAreaTransitions(),
        volume = createVolumeFog(gpu, fog.uniforms, motion),
        tiles = createTileLayer(assets, fog),
        lights = createMapLighting(scene, gpu, assets),
        objects = new Group(),
        prop = new Group();
      prop.userData.objectId = "prop";
      const propMesh = new Mesh(
        new BoxGeometry(0.45, 0.45, 0.45),
        fog.material(new MeshStandardMaterial({ color: 0x998855 })),
      );
      prop.position.set(0.5, 0.475, 0.5);
      prop.add(propMesh);
      objects.add(prop);
      scene.add(tiles.root, objects);
      let appearance;
      function sync(options = {}) {
        motion.sync(doc, options);
        appearance = areaAppearance(doc, "hide", motion);
        volume.update(doc, doc.tiles, [metadata]);
        lights.update(
          doc,
          { ...options, editLights: false },
          {},
          doc.tiles,
          [],
          { x: 2, y: 2 },
          objects,
          null,
          appearance,
        );
      }
      sync();
      tiles.rebuild(
        doc.tiles,
        "render",
        [],
        appearance.tileOpacity,
        appearance.tileGroup,
      );
      function step(delta = 0) {
        motion.advance(delta);
        lights.advance(delta, (id) => tiles.transform(id), objects, null);
        volume.advance(delta);
        tiles.applyAppearance(appearance);
        applySceneAreaAppearance(objects, appearance);
        volume.render(scene, camera);
      }
      step();
      window.transitions = {
        hidden(value, options) {
          doc.areas[0].hidden = value;
          sync(options);
          step();
        },
        fog(value, options) {
          doc.areas[0].fog = value;
          sync(options);
          step();
        },
        power(value) {
          doc.lights[0].enabled = value;
          sync();
          step();
        },
        step,
        state() {
          const tile = tiles.root.children[0];
          return {
            tile: tile.material.opacity,
            prop: propMesh.material.opacity,
            colour: tile.material.color.toArray(),
            brightness: motion.flash("area"),
            fog: motion.fog("area"),
            light: scene.children.find((n) => n.isPointLight)?.intensity || 0,
            textures: gpu.info.memory.textures,
            enabled: doc.lights[0].enabled,
          };
        },
        ready: true,
      };
    </script>
  </body>
</html>
