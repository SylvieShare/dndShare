<!doctype html>
<html>
  <body style="margin: 0">
    <script type="module">
      import {
        ACESFilmicToneMapping,
        AmbientLight,
        DirectionalLight,
        Group,
        OrthographicCamera,
        PointLight,
        Scene,
        WebGLRenderer,
      } from "three";
      import { acquireModelLoader } from "../../../src/features/maps/rendering/modelLoader.js";
      import { createTileLayer } from "../../../src/features/maps/rendering/tileLayer.js";
      import { buildModelObject } from "../../../src/features/maps/rendering/modelObject.js";
      import { applyAreaOpacity } from "../../../src/features/maps/rendering/areaOpacity.js";
      import { renderAreaSurfaces } from "../../../src/features/maps/rendering/areaSurfaceRenderer.js";
      import { createMapFog } from "../../../src/features/maps/rendering/mapFog.js";
      const gpu = new WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: true,
      });
      gpu.setSize(640, 480);
      gpu.toneMapping = ACESFilmicToneMapping;
      document.body.append(gpu.domElement);
      const loader = acquireModelLoader(gpu),
        gltf = await loader.load("/test-model.glb");
      gltf.scene.updateMatrixWorld(true);
      const parts = [];
      gltf.scene.traverse((node) => {
        if (node.isMesh)
          parts.push({
            geometry: node.geometry,
            material: node.material,
            matrix: node.matrixWorld.clone(),
          });
      });
      const metadata = {
        id: "real",
        width: 1,
        height: 1,
        mountDepth: 0.485714,
        maxHeight: 1.423643,
      };
      const assets = { metadata: () => metadata, model: () => ({ parts }) },
        fog = createMapFog();
      fog.update({ width: 4, height: 4, zones: [] }, null, true);
      const scene = new Scene(),
        camera = new OrthographicCamera(-2, 2, 1.5, -1.5, 0.1, 30);
      const tiles = createTileLayer(assets, fog),
        props = new Group(),
        sun = new DirectionalLight(0xffffff, 2);
      sun.position.set(3, 6, 4);
      const ambient = new AmbientLight(0xffffff, 2),
        lamp = new PointLight(0xffc36a, 8, 4);
      lamp.position.set(0.2, 1.65, 0.2);
      const night = new URLSearchParams(location.search).has("night");
      scene.add(tiles.root, props, ambient, sun, lamp);
      const placements = [0, 1].map((x) => ({
        id: `tile-${x}`,
        modelId: "real",
        x,
        y: 0,
        rotation: 0,
      }));
      function frame(opacity, angle = 45, legacy = false, brightness = 1) {
        tiles.rebuild(placements, "render", [], () => opacity);
        tiles.applyAppearance({
          tileOpacity: () => opacity,
          tileFlash: () => brightness,
        });
        props.clear();
        const prop = buildModelObject(
          {
            id: "prop",
            modelId: "real",
            x: 1,
            y: 1.5,
            elevation: -metadata.mountDepth,
            scale: 1,
            rotation: 90,
          },
          assets,
          fog,
        );
        applyAreaOpacity(prop, opacity, brightness);
        props.add(prop);
        camera.position.set(
          1 + Math.sin((angle * Math.PI) / 180) * 5,
          6,
          0.7 + Math.cos((angle * Math.PI) / 180) * 5,
        );
        camera.lookAt(1, 0.2, 0.7);
        camera.updateMatrixWorld(true);
        sun.intensity = night ? 0 : 2;
        ambient.intensity = night ? 0.28 : 2;
        lamp.intensity = night ? 8 * opacity : 0;
        if (legacy) gpu.render(scene, camera);
        else renderAreaSurfaces(gpu, scene, camera);
      }
      function pixels() {
        const gl = gpu.getContext(),
          bytes = new Uint8Array(640 * 480 * 4);
        gl.readPixels(0, 0, 640, 480, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
        return bytes;
      }
      window.realSurfaces = {
        frame,
        compare(opacity, angle, legacy = false) {
          frame(1, angle);
          const solid = pixels();
          frame(opacity, angle, legacy);
          const faded = pixels();
          let changed = 0,
            maximum = 0;
          for (let i = 0; i < solid.length; i += 4) {
            const delta = Math.max(
              ...[0, 1, 2].map((n) =>
                Math.abs(faded[i + n] - solid[i + n] * opacity),
              ),
            );
            if (delta > 3) changed++;
            maximum = Math.max(maximum, delta);
          }
          return { changed, maximum };
        },
        flash() {
          frame(1);
          const before = pixels();
          frame(0.925926, 45, false, 1.625);
          const after = pixels();
          let brighter = 0;
          for (let i = 0; i < before.length; i += 4) {
            // Check the unlit wood/stone, not the already bright emissive flame.
            if (before[i] > 25 && before[i] < 150 && after[i] > before[i] + 12)
              brighter++;
          }
          return brighter;
        },
        ready: true,
      };
      frame(0.5);
    </script>
  </body>
</html>
