<!doctype html>
<html>
  <body style="margin: 0">
    <script type="module">
      import {
        ACESFilmicToneMapping,
        BoxGeometry,
        Color,
        Group,
        HemisphereLight,
        InstancedMesh,
        Matrix4,
        Mesh,
        MeshBasicMaterial,
        BufferGeometry,
        Float32BufferAttribute,
        LineBasicMaterial,
        LineSegments,
        MeshStandardMaterial,
        OrthographicCamera,
        PointLight,
        Scene,
        SphereGeometry,
        WebGLRenderer,
      } from "three";
      import { createSceneFrame } from "/src/features/maps/rendering/sceneFrame.js";
      import { createOutlineDepthReference } from "./outlineDepthReference.js";
      import { createTileOutline } from "/src/features/maps/rendering/tileOutline.js";
      const reference = new URLSearchParams(location.search).has(
        "depthReference",
      );
      const gpu = new WebGLRenderer({
        antialias: reference,
        depth: reference,
        preserveDrawingBuffer: true,
      });
      gpu.setSize(800, 600);
      gpu.setPixelRatio(1.5);
      gpu.toneMapping = ACESFilmicToneMapping;
      gpu.info.autoReset = false;
      document.body.append(gpu.domElement);
      const sharedFrame = reference ? null : createSceneFrame(gpu);
      const scene = new Scene();
      scene.background = new Color("#263142");
      const camera = new OrthographicCamera(-4, 4, 3, -3, 0.1, 100);
      camera.position.set(7, 8, 10);
      camera.lookAt(0, 0.5, 0);
      camera.updateMatrixWorld(true);
      const geometry = new SphereGeometry(0.22, 24, 16),
        material = new MeshStandardMaterial({ color: "#a27c53" });
      for (let x = -5; x <= 5; x++)
        for (let z = -4; z <= 4; z++) {
          const mesh = new Mesh(geometry, material);
          mesh.position.set(x * 0.6, 0, z * 0.6);
          scene.add(mesh);
        }
      const selected = new Group();
      selected.userData.outlineType = "object";
      selected.userData.outlineStyle = "selected";
      const bodyGeometry = new BoxGeometry(0.8, 1.7, 0.8),
        bodyMaterial = new MeshStandardMaterial({ color: "#987452" });
      const body = new URLSearchParams(location.search).has("instances")
        ? new InstancedMesh(bodyGeometry, bodyMaterial, 2)
        : new Mesh(bodyGeometry, bodyMaterial);
      if (body.isInstancedMesh) {
        body.setMatrixAt(0, new Matrix4());
        body.setMatrixAt(1, new Matrix4().makeTranslation(1.2, 0, 0));
      }
      body.position.y = 0.85;
      selected.add(body);
      scene.add(selected);
      const occluder = new Mesh(
        new BoxGeometry(1.2, 1.8, 0.5),
        new MeshStandardMaterial({ color: "#596a7f" }),
      );
      occluder.position.set(0.6, 0.8, 1);
      scene.add(occluder);
      const light = new PointLight("#ffb04a", 20, 12);
      light.position.set(1, 4, 3);
      const markers = new Group(),
        annotations = new Group();
      const glow = new Mesh(
        new SphereGeometry(0.18, 16, 12),
        new MeshBasicMaterial({ color: "#ff8c44", toneMapped: false }),
      );
      glow.position.set(-2.2, 0.5, 0);
      scene.add(glow);
      const gridGeometry = new BufferGeometry();
      gridGeometry.setAttribute(
        "position",
        new Float32BufferAttribute(
          [-3, -0.22, -3, 3, -0.22, 3, -3, -0.22, 3, 3, -0.22, -3],
          3,
        ),
      );
      annotations.add(
        new LineSegments(
          gridGeometry,
          new LineBasicMaterial({
            color: "#c8b695",
            transparent: true,
            opacity: 0.25,
            depthWrite: false,
          }),
        ),
      );
      scene.add(
        light,
        markers,
        annotations,
        new HemisphereLight(0xffffff, 0x665544, 2),
      );
      const frameDepth =
        sharedFrame ||
        createOutlineDepthReference(gpu, scene, () => [
          selected,
          markers,
          annotations,
        ]);
      const animated = [];
      const bend = { value: 0 };
      if (new URLSearchParams(location.search).has("animated")) {
        const animatedMaterial = new MeshStandardMaterial({ color: "#68798a" });
        animatedMaterial.onBeforeCompile = (shader) => {
          shader.uniforms.bend = bend;
          shader.vertexShader = shader.vertexShader
            .replace(
              "#include <common>",
              "#include <common>\nuniform float bend;",
            )
            .replace(
              "#include <begin_vertex>",
              "#include <begin_vertex>\ntransformed.x+=bend*position.y;",
            );
        };
        const mesh = new Mesh(new BoxGeometry(0.3, 1.8, 0.3), animatedMaterial);
        mesh.position.set(-0.5, 0.9, 1);
        mesh.userData.outlineClock = 0;
        mesh.geometry.computeBoundingSphere();
        mesh.geometry.boundingSphere.radius += 2;
        animated.push(mesh);
        scene.add(mesh);
      }
      let outline = createTileOutline(gpu, {}),
        show = true,
        colour;
      function rebuild() {
        outline.destroy();
        outline = createTileOutline(gpu, {});
      }
      function draw() {
        gpu.info.reset();
        outline.update(
          { tiles: [] },
          { master: true, selectionColor: colour },
          "render",
        );
        gpu.setRenderTarget(null);
        gpu.setClearColor("#263142", 1);
        gpu.autoClear = true;
        if (sharedFrame) {
          gpu.setRenderTarget(sharedFrame.prepare());
          gpu.render(scene, camera);
          sharedFrame.present(null);
        } else gpu.render(scene, camera);
        const worldCounts = { ...gpu.info.render };
        gpu.info.reset();
        const start = performance.now();
        outline.render(
          scene,
          camera,
          annotations,
          show ? [selected] : [],
          null,
          [markers],
          frameDepth,
          animated,
        );
        const cpu = performance.now() - start,
          counts = { ...gpu.info.render },
          gl = gpu.getContext(),
          pixels = new Uint8Array(
            gpu.domElement.width * gpu.domElement.height * 4,
          );
        gl.readPixels(
          0,
          0,
          gpu.domElement.width,
          gpu.domElement.height,
          gl.RGBA,
          gl.UNSIGNED_BYTE,
          pixels,
        );
        return {
          cpu,
          calls: counts.calls,
          triangles: counts.triangles,
          pixels,
          textures: gpu.info.memory.textures,
          totalCalls: worldCounts.calls + counts.calls,
          totalTriangles: worldCounts.triangles + counts.triangles,
        };
      }
      window.outlineCache = {
        frame(change) {
          if (change === "light") {
            light.position.x += 0.2;
            light.intensity += 0.25;
          }
          if (change === "shader") {
            bend.value = bend.value ? 0 : 0.65;
            animated[0].userData.outlineClock++;
          }
          if (change === "shaderFar") animated[0].position.x = 20;
          if (change === "dpr") gpu.setPixelRatio(1);
          if (change === "move") {
            selected.position.x += 0.25;
          }
          if (change === "instanceMove") {
            body.setMatrixAt(0, new Matrix4().makeTranslation(2.5, 0, 0));
            body.instanceMatrix.needsUpdate = true;
            body.computeBoundingSphere();
          }
          if (change === "occlude") {
            occluder.position.x -= 0.4;
          }
          if (change === "hide") {
            occluder.visible = !occluder.visible;
          }
          if (change === "camera") {
            camera.position.x += 1;
            camera.lookAt(0, 0.5, 0);
            camera.updateMatrixWorld(true);
          }
          if (change === "palette") {
            colour = "#ff66aa";
          }
          if (change === "geometry") {
            body.geometry = new BoxGeometry(0.6, 2, 0.6);
          }
          if (change === "hover") {
            selected.userData.outlineStyle = "hover";
          }
          if (change === "invalid") {
            selected.userData.outlineStyle = "invalid";
          }
          if (change === "clear") {
            show = false;
          }
          if (change === "restore") {
            show = true;
          }
          if (change === "resize") {
            gpu.setSize(720, 540);
          }
          const value = draw();
          window.outlinePixels = value.pixels;
          return {
            cpu: value.cpu,
            calls: value.calls,
            triangles: value.triangles,
            textures: value.textures,
            totalCalls: value.totalCalls,
            totalTriangles: value.totalTriangles,
          };
        },
        compareFresh() {
          const cached = draw();
          rebuild();
          const fresh = draw();
          let changed = 0,
            max = 0;
          for (let i = 0; i < cached.pixels.length; i++) {
            const delta = Math.abs(cached.pixels[i] - fresh.pixels[i]);
            if (delta) changed++;
            max = Math.max(max, delta);
          }
          return {
            changed,
            max,
            cachedCalls: cached.calls,
            freshCalls: fresh.calls,
          };
        },
        pixels: () => Array.from(window.outlinePixels),
        restoreContext() {
          const extension = gpu.getContext().getExtension("WEBGL_lose_context");
          if (!extension) return false;
          return new Promise((resolve) => {
            gpu.domElement.addEventListener(
              "webglcontextrestored",
              () => resolve(true),
              { once: true },
            );
            gpu.domElement.addEventListener(
              "webglcontextlost",
              () => setTimeout(() => extension.restoreContext(), 60),
              { once: true },
            );
            extension.loseContext();
          });
        },
      };
    </script>
  </body>
</html>
